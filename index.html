<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shopping Smart! | All-Kind Vending Machine</title>
<style>
:root{--ink:#343451;--pink:#ff7ca7;--purple:#8a72d8;--cream:#fff9ee;--mint:#b8edda;--yellow:#ffda7a;--shadow:0 12px 35px #5b49752b}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'Nunito',system-ui,Arial,sans-serif;background:radial-gradient(circle at 10% 15%,#fff2b5 0 10%,transparent 11%),radial-gradient(circle at 90% 80%,#d2f5e8 0 14%,transparent 15%),linear-gradient(135deg,#fce4f0,#e8e1ff 55%,#dff8f3);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #6b56c6;outline-offset:3px}.shell{max-width:920px;margin:auto;padding:20px 18px 35px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;font-size:19px}.tools{display:flex;gap:8px;align-items:center}.mini{border:2px solid #d8c9ee;background:white;padding:9px 13px;border-radius:14px;font-weight:900;color:var(--ink)}.progress{height:12px;background:#fff;border:2px solid #e0d4ed;border-radius:20px;overflow:hidden;margin:16px 0 22px}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff8bb1,#9d87ed);transition:width .35s}.panel{position:relative;background:#fffefa;border:3px solid white;box-shadow:var(--shadow);border-radius:32px;padding:clamp(22px,5vw,48px);min-height:510px;overflow:hidden}.panel:before{content:'✦';position:absolute;right:28px;top:12px;font-size:35px;color:#ffca74;opacity:.8}.tag{display:inline-block;background:#eee7ff;color:#6951ae;border-radius:30px;padding:7px 15px;font-weight:900;font-size:13px;letter-spacing:.5px;text-transform:uppercase}h1{font-size:clamp(35px,6vw,62px);line-height:1.08;margin:16px 0;color:#674fba;font-weight:900}h2{font-size:clamp(25px,4vw,36px);line-height:1.2;margin:16px 0;font-weight:900;color:#604cad}p{line-height:1.6;font-size:18px}.center{text-align:center}.heroemoji{font-size:clamp(60px,11vw,108px);margin:18px 0}.prompt{background:#fff1d4;border:2px dashed #eebf68;padding:20px;border-radius:20px;font-size:clamp(19px,2.7vw,24px);font-weight:800;margin:18px 0;line-height:1.55}.items{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:25px 0}.food{min-width:120px;padding:15px;background:#eff9f4;border-radius:18px;text-align:center;font-weight:900}.food span{display:block;font-size:43px}.choices{display:grid;gap:12px;margin:24px 0}.choice{background:#f5f0ff;border:2px solid #e3d9ff;border-radius:18px;padding:15px 19px;text-align:left;font-weight:800;color:var(--ink);font-size:17px;transition:transform .15s,background .15s}.choice:hover:not(:disabled){transform:translateY(-2px);background:#ece4ff}.choice.correct{background:#d8f6e4;border-color:#5abf88}.choice.wrong{background:#ffe1e6;border-color:#ee8095}.choice:disabled{cursor:default}.feedback{border-radius:16px;padding:13px 18px;font-weight:900;margin:16px 0;background:#e6f7eb;color:#216e47}.feedback.bad{background:#ffe5ea;color:#a63e56}.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:24px}.primary{background:#866bd6;color:white;padding:13px 25px;border-radius:16px;font-size:17px;font-weight:900;box-shadow:0 5px 0 #5c46a4}.primary:hover{filter:brightness(1.05)}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#ffdb83;color:#5d496a;padding:13px 22px;border-radius:16px;font-size:16px;font-weight:900}.muted{color:#79758b;font-size:15px}.wordbank{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.chip{background:#fff1d5;border:2px solid #f3c978;border-radius:13px;padding:9px 12px;font-weight:900}.sentence{font-size:23px;line-height:1.7;font-weight:900;background:#f0f8ff;padding:18px;border-radius:16px;min-height:75px}.textentry{width:100%;border:2px solid #cbbbe7;border-radius:15px;background:#fff;padding:14px 16px;font-size:18px;color:var(--ink);resize:vertical}.checkrow{display:flex;align-items:flex-start;gap:12px;margin:12px 0;font-size:17px;font-weight:700}.checkrow input{width:21px;height:21px;accent-color:#8265cf;flex-shrink:0}.footer{text-align:center;font-size:13px;color:#746a8b;margin-top:16px;font-weight:800}.hidden{display:none!important}.confetti{font-size:38px;letter-spacing:10px}@media(max-width:540px){.panel{min-height:530px}.food{min-width:95px}.actions button{flex:1}.choice{font-size:15px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">🛒 Shopping Smart! <span class="muted">| Digital Companion</span></div><div class="tools"><span id="counter" class="muted">Welcome</span><button class="mini" id="soundBtn" aria-label="Toggle music and sounds">🔊 Sound On</button></div></header><div class="progress"><div class="fill" id="bar"></div></div><section class="panel" id="screen" aria-live="polite"></section><div class="footer">All-Kind Vending Machine • Year 4 English • Eating Right • Made for classroom reinforcement</div></main>
<script>
const el=document.getElementById('screen'),bar=document.getElementById('bar'),counter=document.getElementById('counter'),soundBtn=document.getElementById('soundBtn');let page=0,done={},attempts={},selected=[],textValue='',checklist=[],soundOn=true,audio=null,musicTimer=null,musicIndex=0;
const total=9;
function initAudio(){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!musicTimer)musicTimer=setInterval(musicTick,260)}catch(e){soundOn=false;updateSound()}}
function tone(freq,dur=.13,type='sine',vol=.045,delay=0){if(!soundOn||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sfx(kind){if(!soundOn)return;initAudio();if(kind==='yes'){tone(523,.16);tone(659,.17,'sine',.05,.13);tone(784,.23,'sine',.045,.26)}else if(kind==='no'){tone(260,.15,'triangle',.03);tone(210,.18,'triangle',.03,.12)}else tone(430,.055,'sine',.02)}
const melody=[392,0,440,0,523,0,440,0,349,0,392,0,440,0,392,0,330,0,392,0,440,0,392,0,294,0,330,0,349,0,330,0];function musicTick(){if(!soundOn||!audio||document.hidden)return;const note=melody[musicIndex++%melody.length];if(note)tone(note,.19,'sine',.011)}function updateSound(){soundBtn.textContent=soundOn?'🔊 Sound On':'🔇 Sound Off'}soundBtn.onclick=()=>{soundOn=!soundOn;if(soundOn){initAudio();sfx('click')}else if(musicTimer){clearInterval(musicTimer);musicTimer=null}updateSound()};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(label,fn,cls='primary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function wrap(tag,title,body){return `<div class="tag">${tag}</div><h2>${title}</h2>${body}`}function nav(next=true){return `<div class="actions">${page>0?btn('← Back','go('+(page-1)+')','secondary'):'<span></span>'}${next?btn('Continue →','go('+(page+1)+')') : ''}</div>`}function go(n){sfx('click');page=Math.max(0,Math.min(total,n));render();window.scrollTo({top:0,behavior:'smooth'})}
function choose(i,correct){if(done[page])return;attempts[page]=(attempts[page]||0)+1;const buttons=[...document.querySelectorAll('.choice')];buttons[i].classList.add(i===correct?'correct':'wrong');sfx(i===correct?'yes':'no');const f=document.getElementById('feedback');if(i===correct){done[page]=true;buttons.forEach(b=>b.disabled=true);f.className='feedback';f.textContent='🌟 Correct! Great job, smart shopper!';document.getElementById('next').disabled=false}else{f.className='feedback bad';f.textContent='Almost! Try another answer.';buttons[i].disabled=true}}
function quiz(tag,title,question,options,correct){return wrap(tag,title,`<p>${question}</p><div class="choices">${options.map((o,i)=>`<button class="choice" onclick="choose(${i},${correct})"><b>${'ABC'[i]}.</b> ${esc(o)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="actions">${btn('← Back','go('+(page-1)+')','secondary')}<button class="primary" id="next" onclick="go(${page+1})" disabled>Next Challenge →</button></div>`)}
function render(){bar.style.width=(page/total*100)+'%';counter.textContent=page===0?'Welcome':page===total?'Finished!':`Screen ${page} of ${total-1}`;if(page===0){el.innerHTML=`<div class="center"><div class="tag">Year 4 • Eating Right</div><h1>Shopping Smart!</h1><p>Let's become smart shoppers and sentence writers!</p><div class="heroemoji">🛒 🥪 🍎 🥛</div><p>Five fun challenges, one final writing mission, and lots of learning!</p>${btn('Let’s Play! ✨','start()')}</div>`}
else if(page===1){el.innerHTML=wrap('Warm-up','Remember Our Sentence Pattern!',`<div class="prompt">We are going to buy some ___, some ___ and some ___.</div><p><b>Example:</b> We are going to buy some apples, some bread and some milk.</p><div class="items"><div class="food"><span>🔠</span>Capital letter</div><div class="food"><span>✏️</span>Commas</div><div class="food"><span>🤝</span>and</div><div class="food"><span>🔴</span>Full stop</div></div>${nav()}`)}
else if(page===2){el.innerHTML=quiz('Challenge 1 of 5','What’s Missing?',`<div class="items"><div class="food"><span>🍎</span>Apples</div><div class="food"><span>🍞</span>Bread</div><div class="food"><span>🥛</span>Milk</div></div><div class="prompt">We are going to buy some apples, some ______ and some milk.</div>`,['rice','bread','pizza'],1)}
else if(page===3){el.innerHTML=quiz('Challenge 2 of 5','Spot the Mistake!',`<p>Read the sentence carefully. What is the mistake?</p><div class="prompt">we are going to buy some pizza, some sausages and some hot dogs.</div>`,['Missing capital letter','Missing comma','Missing full stop'],0)}
else if(page===4){el.innerHTML=quiz('Challenge 3 of 5','Choose the Correct Sentence!',`<p>Your family is going shopping for a picnic. Which sentence is written correctly?</p>`,['We are going to buy some sandwiches some grapes and some juice.','We are going to buy some sandwiches, some grapes and some juice.','We are going to buy some sandwiches, some grapes, some juice.'],1)}
else if(page===5){el.innerHTML=wrap('Challenge 4 of 5','Unscramble the Sentence!',`<p>Tap the word groups in the correct order to build one sentence.</p><div class="sentence" id="built">${selected.length?selected.map(x=>esc(parts[x])).join(' '):'<span class="muted">Your sentence will appear here…</span>'}</div><div class="wordbank" id="bank">${parts.map((p,i)=>selected.includes(i)?'':`<button class="chip" onclick="addPart(${i})">${esc(p)}</button>`).join('')}</div><div id="feedback"></div><div class="actions">${btn('← Back','go(4)','secondary')}${btn('↻ Try Again','resetWords()','secondary')}<button class="primary" id="next" onclick="go(6)" ${done[5]?'':'disabled'}>Next Challenge →</button></div>`);if(selected.length===4)checkWords()}
else if(page===6){el.innerHTML=wrap('Challenge 5 of 5','Spell It Right!',`<p>Oops! These food words are misspelled. Type the correct spelling.</p><div class="items"><div class="food"><span>🍎</span>aples</div><div class="food"><span>🥪</span>sandwitches</div><div class="food"><span>🍪</span>biscuts</div></div>${['aples','sandwitches','biscuts'].map((w,i)=>`<label style="display:block;margin:12px 0;font-weight:900">${i+1}. ${w}<input class="textentry" id="spell${i}" style="margin-top:6px" placeholder="Correct spelling" autocomplete="off"></label>`).join('')}<div id="feedback"></div><div class="actions">${btn('← Back','go(5)','secondary')}${btn('Check Spelling ✓','checkSpell()','secondary')}<button class="primary" id="next" onclick="go(7)" disabled>Final Mission →</button></div>`)}
else if(page===7){el.innerHTML=wrap('Final Writing Mission','Be a Smart Shopper!',`<p>You are going on a school picnic with your friends. Write <b>one complete sentence</b> using all three items.</p><div class="items"><div class="food"><span>🍌</span>Bananas</div><div class="food"><span>🥪</span>Sandwiches</div><div class="food"><span>🧃</span>Juice</div></div><textarea class="textentry" id="writing" rows="3" placeholder="We are going to buy…">${esc(textValue)}</textarea><p><b>My Writing Checklist</b></p>${['I started with a capital letter.','I used commas to separate the items.','I used “and” before the last item.','I ended with a full stop.','I spelled the words correctly.'].map((x,i)=>`<label class="checkrow"><input type="checkbox" onchange="toggleCheck(${i},this.checked)" ${checklist.includes(i)?'checked':''}>${x}</label>`).join('')}<div id="feedback"></div><div class="actions">${btn('← Back','saveAndGo(6)','secondary')}${btn('Check My Writing ✓','checkWriting()','secondary')}<button class="primary" id="next" onclick="saveAndGo(8)" ${done[7]?'':'disabled'}>Finish →</button></div>`)}
else if(page===8){el.innerHTML=`<div class="center"><div class="tag">Mission complete</div><h1>Well Done, Smart Shopper!</h1><div class="heroemoji">🏆 🎉 🛒</div><p>You have completed all five challenges and your final writing mission!</p><div class="prompt">Capital letter ✓ &nbsp; Commas ✓ &nbsp; and ✓ &nbsp; Full stop ✓ &nbsp; Spelling ✓</div>${btn('Play Again ↻','restart()')}</div>`}else if(page===9){page=8;render()}}
const parts=['some milk.','We are going','some biscuits and','to buy some apples,'];function addPart(i){if(selected.includes(i)||done[5])return;selected.push(i);sfx('click');render()}function resetWords(){selected=[];done[5]=false;sfx('click');render()}function checkWords(){const good=JSON.stringify(selected)===JSON.stringify([1,3,2,0]);const f=document.getElementById('feedback');if(good){done[5]=true;sfx('yes');f.className='feedback';f.textContent='🌟 Perfect sentence!';document.getElementById('next').disabled=false}else{f.className='feedback bad';f.textContent='Not quite! Press “Try Again” and check the order.';sfx('no')}}
function checkSpell(){const ans=['apples','sandwiches','biscuits'];const vals=ans.map((_,i)=>document.getElementById('spell'+i).value.trim().toLowerCase());const good=vals.every((x,i)=>x===ans[i]);const f=document.getElementById('feedback');f.className='feedback'+(good?'':' bad');f.textContent=good?'🌟 All three words are correct!':'Try again! Check each food word carefully.';sfx(good?'yes':'no');if(good){done[6]=true;document.getElementById('next').disabled=false}}
function toggleCheck(i,on){checklist=on?[...new Set([...checklist,i])]:checklist.filter(x=>x!==i)}function saveAndGo(n){textValue=document.getElementById('writing')?.value||textValue;go(n)}function checkWriting(){textValue=document.getElementById('writing').value;const normalized=textValue.trim().replace(/\s+/g,' ');const expected='We are going to buy some bananas, some sandwiches and some juice.';const f=document.getElementById('feedback');const good=normalized===expected;if(good&&checklist.length===5){done[7]=true;f.className='feedback';f.textContent='🌟 Excellent writing! You checked all five writing rules.';document.getElementById('next').disabled=false;sfx('yes')}else{f.className='feedback bad';f.textContent=!good?'Check your sentence pattern, commas, spelling, capital letter and full stop.':'Great sentence! Tick all five checklist boxes before finishing.';sfx('no')}}
function start(){initAudio();go(1)}function restart(){done={};attempts={};selected=[];textValue='';checklist=[];go(0)}render();
</script></body></html>
